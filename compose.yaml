services:
  postgres:
    image: postgres:16
    container_name: security_incidents_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security_dev_password
      POSTGRES_DB: security_incidents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security_incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: