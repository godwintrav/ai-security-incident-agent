[project]
name = "ai-security-incident-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "godwintrav", email = "godwintrav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
ai-security-incident-agent = "ai_security_incident_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
