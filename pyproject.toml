[project]
name = "ai-security-incident-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "godwintrav", email = "godwintrav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "gradio>=6.28.0",
    "huggingface-hub>=1.32.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.5",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.83.0",
    "numpy>=2.5.3",
    "openai>=3.19.0",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl==1.14.1",
    "uvicorn[standard]>=0.53.0",
    "wandb>=0.30.0",
]

[project.scripts]
ai-security-incident-agent = "ai_security_incident_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
